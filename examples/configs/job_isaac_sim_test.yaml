# Isaac Sim Backend Test Job - Simplified Version
# This is a minimal test configuration that works with the current Isaac Sim backend scaffold
# (which doesn't yet load actual USD files, but validates the configuration structure)
#
# IMPORTANT: This must run inside Isaac Sim's Python environment:
#   Linux: /path/to/isaac-sim/python.sh -m simdata.cli run --backend isaac_sim --config examples/configs/job_isaac_sim_test.yaml
#   Windows: C:\path\to\isaac-sim\python.bat -m simdata.cli run --backend isaac_sim --config examples/configs/job_isaac_sim_test.yaml
#
# Usage:
#   simdata validate examples/configs/job_isaac_sim_test.yaml
#   # Then run with Isaac Sim's Python (see above)
#   # Note: backend is specified in config, so --backend flag must match

job_name: isaac_sim_test
out_dir: outputs/isaac_sim_test
backend: isaac_sim  # Backend specified in config - must match --backend flag
seed: 42
num_frames: 50
dt: 0.0333333  # 30 FPS
headless: true
width: 1280
height: 720

scene:
  usd_path: null  # Will create default Isaac Sim stage
  physics_dt: 0.0166667  # 60 Hz physics
  dome_light_intensity: 1500.0

assets:
  # Test objects (paths are placeholders until USD loading is implemented)
  - name: test_object_1
    usd_path: "assets/test/object1.usd"
    semantic_label: "object"
    scale: 1.0

  - name: test_object_2
    usd_path: "assets/test/object2.usd"
    semantic_label: "object"
    scale: 1.0

sensors:
  # Primary camera
  - name: main_camera
    type: camera_rgb
    pose:
      p: [1.5, 1.5, 1.2]
      q: [0.0, 0.0, 0.0, 1.0]
    intrinsics:
      fx: 800.0
      fy: 800.0
      cx: 640.0
      cy: 360.0

  # Depth camera
  - name: depth_camera
    type: camera_depth
    pose:
      p: [2.0, 0.0, 1.0]
      q: [0.0, 0.0, 0.0, 1.0]
    intrinsics:
      fx: 800.0
      fy: 800.0
      cx: 640.0
      cy: 360.0

randomization:
  random_xy: 0.2
  random_yaw_deg: 180.0

