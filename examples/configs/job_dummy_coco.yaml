# Demo config for dummy backend - works without any external dependencies
# This config generates a small dataset with COCO export
job_name: demo_job
out_dir: outputs/demo_job
seed: 0
num_frames: 10
dt: 0.0333333
headless: true
width: 640
height: 480

scene:
  usd_path: null
  physics_dt: 0.0166667
  dome_light_intensity: 1500.0

assets:
  - name: obj_01
    usd_path: "primitive://box"  # Dummy backend accepts any path, including primitives
    semantic_label: "object"
    scale: 1.0

sensors:
  - name: cam0
    type: camera_rgb
    pose:
      p: [1.5, 1.5, 1.2]
      q: [0.0, 0.0, 0.0, 1.0]
    intrinsics:
      fx: 500
      fy: 500
      cx: 320
      cy: 240

randomization:
  random_xy: 0.2
  random_yaw_deg: 180.0
