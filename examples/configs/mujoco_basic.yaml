# MuJoCo Backend - Basic Test Configuration
# Medium complexity test configuration for MuJoCo backend.
#
# Features:
#   - 50 frames at 1280x720 resolution
#   - 2 test objects
#   - 2 cameras (RGB + depth)
#
# Usage:
#   simdata validate examples/configs/mujoco_basic.yaml
#   simdata run --backend mujoco --config examples/configs/mujoco_basic.yaml
#   # Note: backend is specified in config, so --backend flag must match

job_name: mujoco_test
out_dir: outputs/mujoco_test
backend: mujoco  # Backend specified in config - must match --backend flag
seed: 42
num_frames: 50
dt: 0.0333333  # 30 FPS
headless: true
width: 1280
height: 720

scene:
  usd_path: null  # Will create default MuJoCo scene
  physics_dt: 0.0166667  # 60 Hz physics
  dome_light_intensity: 1500.0

assets:
  # Test objects (paths are placeholders until MJCF loading is implemented)
  - name: test_object_1
    usd_path: "assets/test/object1.mjcf"
    semantic_label: "object"
    scale: 1.0

  - name: test_object_2
    usd_path: "assets/test/object2.mjcf"
    semantic_label: "object"
    scale: 1.0

sensors:
  # Primary camera
  - name: main_camera
    type: camera_rgb
    pose:
      p: [1.5, 1.5, 1.2]
      q: [0.0, 0.0, 0.0, 1.0]
    intrinsics:
      fx: 800.0
      fy: 800.0
      cx: 640.0
      cy: 360.0

  # Depth camera
  - name: depth_camera
    type: camera_depth
    pose:
      p: [2.0, 0.0, 1.0]
      q: [0.0, 0.0, 0.0, 1.0]
    intrinsics:
      fx: 800.0
      fy: 800.0
      cx: 640.0
      cy: 360.0

randomization:
  random_xy: 0.2
  random_yaw_deg: 180.0

